name: Build and deploy electricity prices

on:
  workflow_dispatch:
    inputs:
      send_notification:
        description: "Send the Pushover notification"
        required: false
        default: false
        type: boolean
  push:
    branches: [master]
    paths:
      - "**.R"
      - "**.Rmd"
      - "_bookdown.yml"
      - "style.css"
      - "header.html"
      - "index.Rmd"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    # Retry every 15 minutes around 05:00 Copenhagen time. A state branch
    # records successful delivery, so only one notification is sent per day.
    - cron: "7,22,37,52 3,4 * * *"

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
      notify: ${{ steps.gate.outputs.notify }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Check Copenhagen schedule
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "notify=${{ inputs.send_notification || false }}" >> "$GITHUB_OUTPUT"
          else
            deploy=false
            notify=false
            local_date=$(TZ=Europe/Copenhagen date +%F)
            local_hour=$(TZ=Europe/Copenhagen date +%H)
            git fetch origin electricity-notification-state:refs/remotes/origin/electricity-notification-state 2>/dev/null || true
            last_sent=$(git show origin/electricity-notification-state:last_notification_date 2>/dev/null || true)
            if [ "$local_hour" -ge 5 ] && [ "$local_hour" -lt 12 ] && [ "$last_sent" != "$local_date" ]; then
              deploy=true
              notify=true
            fi
            echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
            echo "notify=$notify" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/ckrusemd/danish-electricity-prices-r:latest
      options: --user root
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Check repository configuration
        run: |
          test -f renv.lock
          test -f _bookdown.yml
          test -f index.Rmd
          test -n "${{ secrets.OPENWEATHERMAP_APIKEY }}"
        env:
          OPENWEATHERMAP_APIKEY: ${{ secrets.OPENWEATHERMAP_APIKEY }}
      - name: Validate shared R code
        run: Rscript --vanilla -e 'parse(file = "R/data.R")'
      - name: Render site
        env:
          OPENWEATHERMAP_APIKEY: ${{ secrets.OPENWEATHERMAP_APIKEY }}
        run: Rscript --vanilla -e 'bookdown::render_book("index.Rmd", output_dir = "_site")'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.notify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/ckrusemd/danish-electricity-prices-r:latest
      options: --user root
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Send Pushover notification
        env:
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: Rscript --vanilla scripts/send-pushover.R

  record-notification:
    needs: [schedule-gate, notify]
    if: github.event_name == 'schedule' && needs.schedule-gate.outputs.notify == 'true' && needs.notify.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Record successful notification
        shell: bash
        run: |
          local_date=$(TZ=Europe/Copenhagen date +%F)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin electricity-notification-state:refs/remotes/origin/electricity-notification-state 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/electricity-notification-state; then
            git checkout -B electricity-notification-state origin/electricity-notification-state
          else
            git checkout --orphan electricity-notification-state
            git rm -rf .
          fi
          printf '%s\n' "$local_date" > last_notification_date
          git add last_notification_date
          git commit -m "Record electricity notification for $local_date"
          git push origin electricity-notification-state
