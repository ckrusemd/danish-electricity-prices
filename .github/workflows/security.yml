name: Security checks

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan working tree, notebooks, and history without printing values
        run: bash scripts/secret-scan.sh
      - name: Set up R for syntax checks
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.6.1'
      - name: Install YAML linter
        run: python3 -m pip install PyYAML==6.0.3
      - name: Parse all repository YAML and scripts
        run: |
          git diff --check
          python3 scripts/notification-lint.py
      - name: Check notification admission, state, concurrency, recovery, and scanner offline
        run: |
          python3 -m unittest discover -s tests/notifications -p 'test_*.py' -v
          Rscript --vanilla tests/notifications/test-content.R
