name: Build and deploy electricity prices

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "**.R"
      - "**.Rmd"
      - "_bookdown.yml"
      - "style.css"
      - "header.html"
      - "index.Rmd"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    # GitHub cron is UTC. The three triggers cover 05:00 and 06:00
    # Copenhagen time across CET/CEST; the gate selects the right job.
    - cron: "0 3 * * *"
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
      notify: ${{ steps.gate.outputs.notify }}
    steps:
      - name: Check Copenhagen schedule
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "notify=false" >> "$GITHUB_OUTPUT"
          else
            deploy=false
            notify=false
            zone=$(TZ=Europe/Copenhagen date +%Z)
            schedule="${{ github.event.schedule }}"
            if { [ "$schedule" = "0 4 * * *" ] && [ "$zone" = "CEST" ]; } || \
               { [ "$schedule" = "0 5 * * *" ] && [ "$zone" = "CET" ]; }; then
              deploy=true
            fi
            if { [ "$schedule" = "0 3 * * *" ] && [ "$zone" = "CEST" ]; } || \
               { [ "$schedule" = "0 4 * * *" ] && [ "$zone" = "CET" ]; }; then
              notify=true
            fi
            echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
            echo "notify=$notify" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/ckrusemd/danish-electricity-prices-r:latest
      options: --user root
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Check repository configuration
        run: |
          test -f renv.lock
          test -f _bookdown.yml
          test -f index.Rmd
      - name: Validate shared R code
        run: Rscript --vanilla -e 'parse(file = "R/data.R")'
      - name: Render site
        run: Rscript --vanilla -e 'bookdown::render_book("index.Rmd", output_dir = "_site")'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.notify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/ckrusemd/danish-electricity-prices-r:latest
      options: --user root
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Send Pushover notification
        env:
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: Rscript --vanilla scripts/send-pushover.R
