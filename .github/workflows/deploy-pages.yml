name: Build and deploy electricity prices

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "**.R"
      - "**.Rmd"
      - "renv.lock"
      - "_bookdown.yml"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    - cron: "17 16 * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
      - name: Restore R packages
        uses: r-lib/actions/setup-renv@v2
      - name: Check repository configuration
        run: |
          test -f renv.lock
          test -f _bookdown.yml
          test -f index.Rmd
      - name: Validate shared R code
        run: Rscript --vanilla -e 'parse(file = "R/data.R")'
      - name: Render site
        run: Rscript -e 'bookdown::render_book("index.Rmd", output_dir = "_site")'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
