name: Build and deploy electricity prices

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "**.R"
      - "**.Rmd"
      - "_bookdown.yml"
      - "style.css"
      - "header.html"
      - "index.Rmd"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    # Two UTC candidates cover 05:17 in Copenhagen across DST. The Pages
    # state branch ensures that delayed or duplicate starts deploy only once.
    - cron: "7,22,37,52 3,4 * * *"

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Check Copenhagen schedule
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            deploy=false
            local_date=$(TZ=Europe/Copenhagen date +%F)
            local_hour=$(TZ=Europe/Copenhagen date +%H)
            git fetch origin electricity-pages-state:refs/remotes/origin/electricity-pages-state 2>/dev/null || true
            last_deployed=$(git show origin/electricity-pages-state:last_deployment_date 2>/dev/null || true)
            if [ "$((10#$local_hour))" -ge 5 ] && [ "$last_deployed" != "$local_date" ]; then
              deploy=true
            fi
            echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/ckrusemd/danish-electricity-prices-r:latest
      options: --user root
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Check repository configuration
        run: |
          test -f renv.lock
          test -f _bookdown.yml
          test -f index.Rmd
          test -n "${{ secrets.OPENWEATHERMAP_APIKEY }}"
        env:
          OPENWEATHERMAP_APIKEY: ${{ secrets.OPENWEATHERMAP_APIKEY }}
      - name: Validate shared R code
        run: Rscript --vanilla -e 'parse(file = "R/data.R")'
      - name: Render site
        env:
          OPENWEATHERMAP_APIKEY: ${{ secrets.OPENWEATHERMAP_APIKEY }}
        run: Rscript --vanilla -e 'bookdown::render_book("index.Rmd", output_dir = "_site")'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  record-deployment:
    needs: deploy
    if: github.event_name == 'schedule' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Record successful deployment
        shell: bash
        run: |
          local_date=$(TZ=Europe/Copenhagen date +%F)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin electricity-pages-state:refs/remotes/origin/electricity-pages-state 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/electricity-pages-state; then
            git checkout -B electricity-pages-state origin/electricity-pages-state
          else
            git checkout --orphan electricity-pages-state
            git rm -rf . || true
          fi
          printf '%s\n' "$local_date" > last_deployment_date
          git add last_deployment_date
          git commit -m "Record electricity deployment for $local_date"
          git push origin electricity-pages-state
