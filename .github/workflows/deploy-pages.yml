name: Build and deploy electricity prices

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "**.R"
      - "**.Rmd"
      - "_bookdown.yml"
      - "style.css"
      - "header.html"
      - "index.Rmd"
      - ".github/workflows/deploy-pages.yml"
  schedule:
    # GitHub cron is UTC. These two triggers cover CET and CEST; the gate
    # below allows only the trigger that corresponds to 06:00 Copenhagen time.
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Check Copenhagen schedule
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(TZ=Europe/Copenhagen date +%H)" = "06" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/ckrusemd/danish-electricity-prices-r:latest
      options: --user root
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Check repository configuration
        run: |
          test -f renv.lock
          test -f _bookdown.yml
          test -f index.Rmd
      - name: Validate shared R code
        run: Rscript --vanilla -e 'parse(file = "R/data.R")'
      - name: Render site
        run: Rscript --vanilla -e 'bookdown::render_book("index.Rmd", output_dir = "_site")'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
