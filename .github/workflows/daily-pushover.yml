name: Daily Pushover electricity
run-name: Electricity Pushover • ${{ inputs.delivery_slot || 'morning' }} • ${{ inputs.dispatch_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      delivery_slot:
        description: Electricity supports the morning slot only
        required: true
        default: morning
        type: choice
        options: [morning]
      scheduled_delivery:
        description: Respect 05:00 Copenhagen admission and the daily journal
        required: true
        default: true
        type: boolean
      force_send:
        description: Manual send without a daily record (scheduled_delivery must be false)
        required: false
        default: false
        type: boolean
      trigger_source:
        description: Scheduler source for run identification
        required: false
        default: manual
        type: choice
        options: [manual, external, local]
      dispatch_id:
        description: Optional scheduler correlation ID
        required: false
        default: manual
        type: string
  schedule:
    # Independent attempts: no active runner waits between these invocations.
    - cron: "0,17,37 5 * * *"
      timezone: Europe/Copenhagen
    - cron: "17,37 6-8 * * *"
      timezone: Europe/Copenhagen
    - cron: "37 9-23 * * *"
      timezone: Europe/Copenhagen

permissions:
  contents: read

concurrency:
  group: electricity-pushover-morning
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      action: ${{ steps.gate.outputs.action }}
      date: ${{ steps.gate.outputs.date }}
      slot: ${{ steps.gate.outputs.slot }}
      attempt: ${{ steps.gate.outputs.attempt }}
      record_daily: ${{ steps.gate.outputs.record_daily }}
      image: ${{ steps.image.outputs.image }}
      environment_hash: ${{ steps.image.outputs.environment_hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Admit morning delivery or receipt recovery
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SLOT: ${{ inputs.delivery_slot || 'morning' }}
          SCHEDULED_DELIVERY: ${{ github.event_name == 'schedule' || inputs.scheduled_delivery == true }}
          FORCE_SEND: ${{ inputs.force_send || false }}
        run: python3 scripts/notification-state.py gate
      - name: Resolve verified environment image
        id: image
        if: steps.gate.outputs.action != 'skip'
        run: python3 scripts/notification-image.py
      - name: Gate summary
        if: always()
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          IMAGE_OUTCOME: ${{ steps.image.outcome }}
          GATE_ACTION: ${{ steps.gate.outputs.action }}
          GATE_REASON: ${{ steps.gate.outputs.reason }}
          GATE_DATE: ${{ steps.gate.outputs.date }}
        run: |
          echo "Notification gate: action=$GATE_ACTION reason=$GATE_REASON date=$GATE_DATE gate=$GATE_OUTCOME environment=$IMAGE_OUTCOME" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$GATE_ACTION" = skip ]; then
            echo "Skipped: this successful gate did not send a notification." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          test "$GATE_OUTCOME" = success
          if [ "$GATE_ACTION" != skip ]; then test "$IMAGE_OUTCOME" = success; fi

  delivery:
    needs: gate
    if: needs.gate.outputs.action == 'send' || needs.gate.outputs.action == 'recover'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    container:
      image: ${{ needs.gate.outputs.image }}
      options: --user root
    env:
      GH_TOKEN: ${{ github.token }}
      NOTIFICATION_DATE: ${{ needs.gate.outputs.date }}
      NOTIFICATION_RECORD_DAILY: ${{ needs.gate.outputs.record_daily }}
      NOTIFICATION_ATTEMPT: ${{ needs.gate.outputs.attempt || format('{0}-{1}', github.run_id, github.run_attempt) }}
      NOTIFICATION_ARTIFACT: notification-receipt-${{ github.run_id }}-${{ github.run_attempt }}
      PUSHOVER_RESULT_FILE: pushover-result.json
      ELECTRICITY_DATA_FILE: notification-data.rds
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify locked runtime and environment fingerprint
        run: Rscript --vanilla scripts/verify-environment.R --image
      - name: Recover confirmed receipt without a notification POST
        id: recover
        if: needs.gate.outputs.action == 'recover'
        run: python3 scripts/notification-state.py recover
      - name: Prepare shared snapshot without weather
        if: needs.gate.outputs.action == 'send'
        run: Rscript --vanilla scripts/prepare-data.R --without-weather --output notification-data.rds
      - name: Claim, send once, and immediately record acceptance
        id: send
        if: needs.gate.outputs.action == 'send'
        env:
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
        run: Rscript --vanilla scripts/send-pushover.R
      - name: Preserve confirmed receipt even if journal write failed
        if: always() && needs.gate.outputs.action == 'send' && hashFiles('pushover-result.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: notification-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: pushover-result.json
          retention-days: 90
          if-no-files-found: error
      - name: Delivery summary
        if: always()
        env:
          ACTION: ${{ needs.gate.outputs.action }}
          SEND_OUTCOME: ${{ steps.send.outcome }}
          RECOVER_OUTCOME: ${{ steps.recover.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          expected=accepted-and-recorded
          if [ "$NOTIFICATION_RECORD_DAILY" = false ]; then expected=accepted-unrecorded-manual; fi
          if [ "$ACTION" = recover ]; then expected=receipt-recovered-without-resend; fi
          echo "Notification delivery: expected=$expected send=$SEND_OUTCOME recovery=$RECOVER_OUTCOME job=$JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
          test "$JOB_STATUS" = success
          if [ "$ACTION" = send ]; then test "$SEND_OUTCOME" = success; else test "$RECOVER_OUTCOME" = success; fi
