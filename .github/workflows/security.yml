name: Security checks

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan repository and history for secrets
        run: bash scripts/secret-scan.sh
      - name: Set up R for syntax checks
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.6.1'
      - name: Validate repository files
        run: |
          test -f .github/workflows/deploy-pages.yml
          test -f .github/workflows/daily-pushover.yml
          test -f .github/workflows/build-container.yml
          test -f Dockerfile
          test -f .dockerignore
          test -f .github/dependabot.yml
          test -f renv.lock
          test -f _bookdown.yml
          git diff --check
      - name: Validate shared R source is present
        run: |
          test -s R/data.R
          bash -n scripts/dispatch-daily-pushover.sh
          Rscript --vanilla -e 'parse(file = "R/data.R"); parse(file = "scripts/send-pushover.R")'
